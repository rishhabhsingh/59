<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial;
  background: #f0f4f8;
}

form {
  width: 300px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

input:focus, textarea:focus {
  border-color: #3498db;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #2c80b4;
}
</style>
</head>

<body>

<form>
  <h2>Contact Us</h2>

  <input type="text" placeholder="Name" required>
  <input type="email" placeholder="Email" required>
  <textarea placeholder="Message" required></textarea>

  <button type="submit">Send</button>
</form>

</body>
</html>
