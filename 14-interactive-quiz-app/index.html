<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .quiz-container {
            background: white;
            width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        #question {
            font-size: 22px;
            margin-bottom: 20px;
            color: #222;
        }

        .option {
            background: #f7f7f7;
            border: 2px solid #ddd;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: #e8f0fe;
            border-color: #4285f4;
        }

        .selected {
            background: #d2e3fc;
            border-color: #1a73e8;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #1558c0;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            text-align: center;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>Interactive Quiz App</h1>

        <div id="quiz">
            <h2 id="question">Question Text</h2>

            <div id="options"></div>

            <button id="nextBtn">Next Question</button>

            <div id="result"></div>
        </div>
    </div>

    <script>
        // Quiz Questions
        const quizData = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Transfer Machine Language",
                    "Hyperlink Text Management Language",
                    "Home Tool Markup Language"
                ],
                correct: 0
            },
            {
                question: "Which language is used for styling web pages?",
                options: [
                    "HTML",
                    "Python",
                    "CSS",
                    "C++"
                ],
                correct: 2
            },
            {
                question: "Which JavaScript method is used to select an element by ID?",
                options: [
                    "querySelectorAll()",
                    "getElementById()",
                    "getElementsByClassName()",
                    "selectElement()"
                ],
                correct: 1
            },
            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: [
                    "var",
                    "int",
                    "string",
                    "define"
                ],
                correct: 0
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const nextBtn = document.getElementById("nextBtn");
        const resultElement = document.getElementById("result");

        // Load Question
        function loadQuestion() {

            selectedOption = null;

            const currentQuiz = quizData[currentQuestion];

            questionElement.textContent = currentQuiz.question;

            optionsElement.innerHTML = "";

            currentQuiz.options.forEach((option, index) => {

                const optionDiv = document.createElement("div");

                optionDiv.textContent = option;

                optionDiv.classList.add("option");

                optionDiv.addEventListener("click", () => selectOption(optionDiv, index));

                optionsElement.appendChild(optionDiv);
            });
        }

        // Select Option
        function selectOption(optionDiv, index) {

            const allOptions = document.querySelectorAll(".option");

            allOptions.forEach(option => {
                option.classList.remove("selected");
            });

            optionDiv.classList.add("selected");

            selectedOption = index;
        }

        // Next Button Event
        nextBtn.addEventListener("click", () => {

            if (selectedOption === null) {
                alert("Please select an answer!");
                return;
            }

            // Check Answer
            if (selectedOption === quizData[currentQuestion].correct) {
                score++;
            }

            currentQuestion++;

            // Show Result
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        // Display Final Result
        function showResult() {

            questionElement.style.display = "none";
            optionsElement.style.display = "none";
            nextBtn.style.display = "none";

            resultElement.innerHTML =
                `You scored ${score} out of ${quizData.length}!`;
        }

        // Start Quiz
        loadQuestion();

        // Console Logs
        console.log("Quiz App Loaded Successfully");
        console.log("Total Questions:", quizData.length);
    </script>

</body>
</html>
